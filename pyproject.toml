[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wintoolbox"
version = "1.0.0"
description = "Caixa de Ferramentas completa para Windows em Python com PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
    "pywin32>=306",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
wintoolbox = "wintoolbox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
